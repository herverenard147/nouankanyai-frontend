name: Secrets

# Volet 1 (plan corrigé du 2026-10-10) : aucun nouveau secret ne doit entrer dans l'historique.
# Seuls les commits apportés par la PR ou le push sont analysés : les clés déjà présentes dans
# l'historique (ancien backend/.env) sont traitées par leur révocation, pas par ce contrôle.
on:
  push:
    branches: [main, feat/ci-tests]
  pull_request:
    branches: [main, feat/ci-tests]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer gitleaks 8.21.2 (empreinte vérifiée)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.21.2
          curl -sSLo gl.tgz "$base/gitleaks_8.21.2_linux_x64.tar.gz"
          curl -sSLo sums.txt "$base/gitleaks_8.21.2_checksums.txt"
          grep linux_x64.tar.gz sums.txt | awk '{print $1"  gl.tgz"}' | sha256sum -c
          tar xzf gl.tgz gitleaks
      - name: Analyser les nouveaux commits
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/$BASE_REF..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          echo "Commits analysés : $range"
          ./gitleaks git . --redact --no-banner --log-opts="$range"
